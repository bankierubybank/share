# DRAFT (#18) — inactive until the repo has a GitHub remote. See docs/CI.md.
# Every push / PR: the same gate as `npm run test:local` (typecheck → unit → build → integration →
# wrangler dev → system / security / E2E). No secrets needed: everything runs against a local Worker + local D1.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Playwright browsers
        # Firefox runs here (Linux) only: it won't launch on the dev Mac (docs/ISSUES.md #1), so test:local skips it.
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Local gate
        run: npm run test:local
        env:
          COMPAT_PROJECTS: chromium firefox webkit mobile-chrome mobile-safari
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .wrangler-dev.log
          retention-days: 7
