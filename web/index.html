<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Split bills with friends. Track who paid, who shares, and who owes whom." />
    <meta name="theme-color" content="#006a60" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)" />
    <title>Share — split bills</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- use-credentials: the manifest is behind Cloudflare Access; without the cookie it would get the login page. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- Blocking, tiny: applies saved light/dark choice before first paint (CSP forbids inline scripts). -->
    <script src="/theme.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Share needs JavaScript enabled.</noscript>
  </body>
</html>
